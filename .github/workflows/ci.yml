name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go (${{ matrix.os }}, ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make check
      - name: Build and smoke-test CLI
        run: |
          make build
          ./bin/arbor version
          ./bin/arbor list --path "$PWD" --json

  cli:
    name: Portable CLI packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: make package VERSION=dev
      - uses: actions/upload-artifact@v6
        with:
          name: arbor-cli
          path: dist/arbor_*
          if-no-files-found: error
          retention-days: 14

  # The real application and the real command-line program, on real Git
  # repositories made for the purpose: every feature through the window with
  # mouse and keyboard, and the command line interrupted, raced and misused.
  e2e:
    name: End to end
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Everything a scenario makes goes in one folder, so that what a
      # failed one leaves can be kept.
      - name: Choose where scenarios work
        run: |
          mkdir -p "$RUNNER_TEMP/arbor"
          echo "TMPDIR=$RUNNER_TEMP/arbor" >> "$GITHUB_ENV"
      - name: Drive the application through every feature
        run: npm run test:e2e -- --jobs 2
      - name: Stress the command-line program
        run: npm run test:stress
        env:
          STRESS_INTERRUPTS: '80'
          STRESS_SCALE: '1000'
      - name: Keep what a failed scenario left
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failures
          path: |
            ${{ runner.temp }}/arbor/arbor-e2e-*/failure-*
            ${{ runner.temp }}/arbor/arbor-e2e-*/cli-calls.log
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: amd64
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - name: Build desktop distribution
        run: npm run desktop:package
      - name: Verify distributed Mac archive
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-package.sh dist/arbor_*.app.zip
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test first-launch setup and live scan results
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 60s node_modules/.bin/electron scripts/test-desktop-flow.cjs --no-sandbox
      - name: Test workspace caching and cleanup statistics
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 60s node_modules/.bin/electron scripts/test-desktop-workspaces.cjs --no-sandbox
      - name: Test independent multi-host scans and cleanup
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 60s node_modules/.bin/electron scripts/test-desktop-multihost.cjs --no-sandbox
      - name: Test closing during scans and cleanup
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 60s node_modules/.bin/electron scripts/test-desktop-close.cjs --no-sandbox
      - name: Test packaged app and real CLI cleanup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-packaged.cjs
      - name: Test packaged app and real CLI cleanup (macOS)
        if: runner.os == 'macOS'
        run: node scripts/test-packaged.cjs
      - name: Test native macOS close lifecycle
        if: runner.os == 'macOS'
        run: node_modules/.bin/electron scripts/test-desktop-close.cjs
      - uses: actions/upload-artifact@v6
        with:
          name: arbor-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/arbor_*.app.zip
            dist/arbor_*.AppImage
            dist/arbor_*.desktop.tar.gz
          if-no-files-found: error
          retention-days: 14

  homebrew:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm run test:scripts
      - name: Generate a temporary tap from the latest release
        run: |
          set -euo pipefail
          tag=$(curl --fail --silent --show-error --location \
            https://api.github.com/repos/stbenjam/arbor/releases/latest | jq -er .tag_name)
          echo "ARBOR_RELEASE=$tag" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location \
            "https://github.com/stbenjam/arbor/releases/download/$tag/arbor_${tag}_checksums.txt" \
            --output "$RUNNER_TEMP/arbor-checksums.txt"
          tap="$(brew --repository)/Library/Taps/arbor/homebrew-check"
          mkdir -p "$tap"
          git -C "$tap" init -b main
          node scripts/homebrew.cjs "$tag" "$RUNNER_TEMP/arbor-checksums.txt" "$tap"
          git -C "$tap" add Formula Casks
          git -C "$tap" -c user.name='Arbor CI' -c user.email='ci@example.invalid' \
            commit -m 'Generate recipes for validation'
      - name: Check Homebrew style and audit
        run: |
          brew style arbor/check
          brew audit --strict --tap=arbor/check
      - name: Install and test the CLI
        run: |
          set -euo pipefail
          brew install --formula arbor/check/arbor
          brew test arbor/check/arbor
          arbor version | tee "$RUNNER_TEMP/arbor-version.txt"
          grep -Fx "arbor $ARBOR_RELEASE" "$RUNNER_TEMP/arbor-version.txt"
          prefix=$(brew --prefix arbor/check/arbor)
          test -s "$prefix/etc/bash_completion.d/arbor"
          test -s "$prefix/share/zsh/site-functions/_arbor"
          test -s "$prefix/share/fish/vendor_completions.d/arbor.fish"
      - name: Install and check the macOS app without opening it
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install --cask arbor/check/arbor
          test -d /Applications/Arbor.app
          /Applications/Arbor.app/Contents/Resources/bin/arbor-cli version \
            | tee "$RUNNER_TEMP/arbor-app-version.txt"
          cmp "$RUNNER_TEMP/arbor-version.txt" "$RUNNER_TEMP/arbor-app-version.txt"
      - name: Remove installations and the temporary tap
        if: always()
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]] && brew list --cask arbor/check/arbor >/dev/null 2>&1; then
            brew uninstall --cask arbor/check/arbor
          fi
          if brew list --formula arbor/check/arbor >/dev/null 2>&1; then
            brew uninstall --formula arbor/check/arbor
          fi
          if [[ -d "$(brew --repository)/Library/Taps/arbor/homebrew-check" ]]; then
            brew untap arbor/check
          fi
