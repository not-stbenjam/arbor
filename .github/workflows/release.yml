name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version for build artifacts (does not publish a release)
        required: true
        default: v0.1.0

permissions:
  contents: read

env:
  ARBOR_VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: make check

  cli:
    name: Portable CLI packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: bash scripts/package.sh "$ARBOR_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli
          path: dist/arbor_*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: amd64
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run desktop:package
      - name: Verify distributed Mac archive
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-package.sh dist/arbor_*.app.zip
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test first-launch setup and live scan results
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 60s node_modules/.bin/electron scripts/test-desktop-flow.cjs --no-sandbox
      - name: Test closing during scans and cleanup
        if: runner.os == 'Linux'
        run: xvfb-run -a timeout 60s node_modules/.bin/electron scripts/test-desktop-close.cjs --no-sandbox
      - name: Smoke-test desktop
        if: runner.os == 'Linux'
        env:
          ARBOR_SMOKE_TEST: '1'
        run: |
          export ARBOR_SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/arbor-smoke.XXXXXX")"
          xvfb-run -a timeout 30s "dist/linux${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/arbor-desktop" --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/arbor_*.app.zip
            dist/arbor_*.AppImage
            dist/arbor_*.desktop.tar.gz
          if-no-files-found: error

  publish:
    name: Assemble and publish release assets
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate combined checksums
        working-directory: dist
        run: sha256sum arbor_*.tar.gz arbor_*.app.zip arbor_*.AppImage > "arbor_${ARBOR_VERSION}_checksums.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: arbor-${{ env.ARBOR_VERSION }}
          path: dist/arbor_*
          if-no-files-found: error
      - name: Attach all assets to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$ARBOR_VERSION" dist/arbor_* --clobber
