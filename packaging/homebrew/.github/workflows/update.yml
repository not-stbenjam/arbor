name: Update Arbor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-arbor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Generate recipes from the latest published release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Asked with the job's own token: unnamed callers share a small
          # allowance, and GitHub's machines use it up between them. A release
          # is published some minutes before its files are all there, so the
          # one taken is the newest that has every file the recipes name.
          tag=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            'https://api.github.com/repos/stbenjam/arbor/releases?per_page=10' | jq -er '
              [ .[]
                | select((.draft or .prerelease) | not)
                | . as $release
                | select(
                    ["checksums.txt", "darwin_arm64.tar.gz", "darwin_amd64.tar.gz",
                     "linux_arm64.tar.gz", "linux_amd64.tar.gz",
                     "darwin_arm64.app.zip", "darwin_amd64.app.zip"]
                    | all(. as $suffix
                          | any($release.assets[];
                                .name == "arbor_\($release.tag_name)_\($suffix)"
                                and .state == "uploaded")))
              ][0].tag_name')
          curl --fail --silent --show-error --location \
            "https://github.com/stbenjam/arbor/releases/download/$tag/arbor_${tag}_checksums.txt" \
            --output "$RUNNER_TEMP/checksums.txt"
          # Releases before the generator was added need the current generator.
          status=$(curl --silent --show-error --location --write-out '%{http_code}' \
            "https://raw.githubusercontent.com/stbenjam/arbor/$tag/scripts/homebrew.cjs" \
            --output "$RUNNER_TEMP/homebrew.cjs")
          if [[ "$status" == 404 ]]; then
            curl --fail --silent --show-error --location \
              https://raw.githubusercontent.com/stbenjam/arbor/main/scripts/homebrew.cjs \
              --output "$RUNNER_TEMP/homebrew.cjs"
          elif [[ "$status" != 200 ]]; then
            echo "Could not fetch the generator at $tag (HTTP $status)" >&2
            exit 1
          fi
          node "$RUNNER_TEMP/homebrew.cjs" "$tag" "$RUNNER_TEMP/checksums.txt" .
          git add Formula/arbor.rb Casks/arbor.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Arbor to $tag"
          git push
