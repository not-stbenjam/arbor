name: Update Arbor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-arbor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Generate recipes from the latest published release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Asked with the job's own token: unnamed callers share a small
          # allowance, and GitHub's machines use it up between them.
          tag=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/stbenjam/arbor/releases/latest | jq -er .tag_name)
          curl --fail --silent --show-error --location \
            "https://github.com/stbenjam/arbor/releases/download/$tag/arbor_${tag}_checksums.txt" \
            --output "$RUNNER_TEMP/checksums.txt"
          # Releases before the generator was added need the current generator.
          status=$(curl --silent --show-error --location --write-out '%{http_code}' \
            "https://raw.githubusercontent.com/stbenjam/arbor/$tag/scripts/homebrew.cjs" \
            --output "$RUNNER_TEMP/homebrew.cjs")
          if [[ "$status" == 404 ]]; then
            curl --fail --silent --show-error --location \
              https://raw.githubusercontent.com/stbenjam/arbor/main/scripts/homebrew.cjs \
              --output "$RUNNER_TEMP/homebrew.cjs"
          elif [[ "$status" != 200 ]]; then
            echo "Could not fetch the generator at $tag (HTTP $status)" >&2
            exit 1
          fi
          node "$RUNNER_TEMP/homebrew.cjs" "$tag" "$RUNNER_TEMP/checksums.txt" .
          git add Formula/arbor.rb Casks/arbor.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Arbor to $tag"
          git push
