name: Test Arbor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # GitHub's Linux machines have Homebrew, but not on the path.
      - name: Put Homebrew on the path
        if: runner.os == 'Linux'
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Register the checked-out tap
        run: |
          set -euo pipefail
          tap="$(brew --repository)/Library/Taps/arbor/homebrew-check"
          # A local clone tests this commit, including pull requests.
          git clone "$GITHUB_WORKSPACE" "$tap"
          version=$(brew info --json=v2 --formula arbor/check/arbor | jq -er '.formulae[0].versions.stable')
          echo "ARBOR_RELEASE=v$version" >> "$GITHUB_ENV"
      - name: Check Homebrew style and audit
        run: |
          brew style arbor/check
          brew audit --strict --tap=arbor/check
      - name: Install and test the CLI
        run: |
          set -euo pipefail
          brew install --formula arbor/check/arbor
          brew test arbor/check/arbor
          arbor version | tee "$RUNNER_TEMP/arbor-version.txt"
          grep -Fx "arbor $ARBOR_RELEASE" "$RUNNER_TEMP/arbor-version.txt"
          prefix=$(brew --prefix arbor/check/arbor)
          test -s "$prefix/etc/bash_completion.d/arbor"
          test -s "$prefix/share/zsh/site-functions/_arbor"
          test -s "$prefix/share/fish/vendor_completions.d/arbor.fish"
      - name: Install and check the macOS app without opening it
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install --cask arbor/check/arbor
          test -d /Applications/Arbor.app
          /Applications/Arbor.app/Contents/Resources/bin/arbor-cli version \
            | tee "$RUNNER_TEMP/arbor-app-version.txt"
          cmp "$RUNNER_TEMP/arbor-version.txt" "$RUNNER_TEMP/arbor-app-version.txt"
      - name: Remove installations and the temporary tap
        if: always()
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]] && brew list --cask arbor/check/arbor >/dev/null 2>&1; then
            brew uninstall --cask arbor/check/arbor
          fi
          if brew list --formula arbor/check/arbor >/dev/null 2>&1; then
            brew uninstall --formula arbor/check/arbor
          fi
          if [[ -d "$(brew --repository)/Library/Taps/arbor/homebrew-check" ]]; then
            brew untap arbor/check
          fi
